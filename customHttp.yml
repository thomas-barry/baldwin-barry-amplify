# Response headers for Amplify Hosting. This file overrides the Custom headers
# section of the Amplify console, so every header the site sends lives here.
# Changes take effect on the next build.
#
# The Content-Security-Policy is enforced: anything it does not allow is
# blocked, and the violation is logged to the browser console only (there is
# no report-uri). X-Frame-Options duplicates frame-ancestors for older browsers.
customHeaders:
  - pattern: '**/*.{js,css,png,jpg,gif,woff,woff2}'
    headers:
      - key: Cache-Control
        value: public,max-age=31536000,immutable
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: public,max-age=0,must-revalidate
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://d3v1ijc4huf10a.cloudfront.net https://*.s3.us-east-1.amazonaws.com https://picsum.photos https://fastly.picsum.photos; connect-src 'self' https://*.appsync-api.us-east-1.amazonaws.com https://cognito-idp.us-east-1.amazonaws.com https://cognito-identity.us-east-1.amazonaws.com https://*.s3.us-east-1.amazonaws.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
